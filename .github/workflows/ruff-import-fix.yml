name: Ruff import ordering fix

on:
  push:
    paths:
      - '.github/workflows/ruff-import-fix.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: pip install ruff
      - name: Fix import ordering
        run: ruff check main.py ui/app.py --fix
      - name: Verify full project
        run: ruff check .
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add main.py ui/app.py
            git commit -m "Fix Ruff import ordering"
            git push
          fi
