name: Apply and measure internal documentation

on:
  push:
    branches:
      - c1-9-doc-measure
  workflow_dispatch:

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c1-9-doc-measure
      - name: Add module documentation
        run: python tools/add_internal_documentation.py
      - name: Measure Python documentation ratio
        run: python tools/documentation_ratio.py
      - name: Commit documented sources when needed
        run: |
          if git diff --quiet; then
            echo "No documentation changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py collectors models repositories services ui utils
          git commit -m "Document Athena production modules"
          git push origin HEAD:c1-9-doc-measure
