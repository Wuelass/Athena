name: One-shot Ruff cleanup

on:
  push:
    branches:
      - fix/ruff-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ruff-cleanup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Apply manual Ruff corrections
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != expected:
                  raise RuntimeError(
                      f"{path}: expected {expected} occurrence(s), found {count} for {old!r}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8")

          # DTZ005: always generate timezone-aware timestamps.
          replace(
              "collectors/base_collector.py",
              "from datetime import datetime",
              "from datetime import UTC, datetime",
          )
          replace(
              "collectors/base_collector.py",
              'return datetime.now().isoformat(timespec="seconds")',
              'return datetime.now(UTC).isoformat(timespec="seconds")',
          )

          # Epic: narrow file/JSON exceptions. The Epic log timestamp itself contains no timezone metadata,
          # so keep it naive deliberately instead of inventing a timezone.
          replace(
              "collectors/epic/epic_collector.py",
              "        except Exception as exc:\n            duration = perf_counter() - start_timer",
              "        except Exception as exc:  # noqa: BLE001\n            duration = perf_counter() - start_timer",
          )
          replace(
              "collectors/epic/epic_collector.py",
              '            except Exception as exc:\n                if self.debug:\n                    print(f"[EPIC DEBUG] échec lecture LauncherInstalled.dat: {exc}")',
              '            except (OSError, json.JSONDecodeError) as exc:\n                if self.debug:\n                    print(f"[EPIC DEBUG] échec lecture LauncherInstalled.dat: {exc}")',
          )
          replace(
              "collectors/epic/epic_collector.py",
              '                except Exception as exc:\n                    if self.debug:\n                        print(f"[EPIC DEBUG] échec lecture manifest {manifest_path.name}: {exc}")',
              '                except (OSError, json.JSONDecodeError) as exc:\n                    if self.debug:\n                        print(f"[EPIC DEBUG] échec lecture manifest {manifest_path.name}: {exc}")',
          )
          replace(
              "collectors/epic/epic_collector.py",
              '            except Exception as exc:\n                if self.debug:\n                    print(f"[EPIC DEBUG] échec lecture log {log_path.name}: {exc}")',
              '            except OSError as exc:\n                if self.debug:\n                    print(f"[EPIC DEBUG] échec lecture log {log_path.name}: {exc}")',
          )
          replace(
              "collectors/epic/epic_collector.py",
              "            return datetime(year, month, day, hour, minute, second)",
              "            return datetime(year, month, day, hour, minute, second)  # noqa: DTZ001",
          )

          # osu!: helper methods normalize network failures to RuntimeError; invalid payloads are TypeError.
          replace(
              "collectors/osu_collector.py",
              "        except Exception as exc:\n            duration = perf_counter() - start_timer",
              "        except (RuntimeError, TypeError, ValueError) as exc:\n            duration = perf_counter() - start_timer",
          )
          replace(
              "collectors/osu_collector.py",
              '            raise RuntimeError("Format inattendu reçu depuis osu API")',
              '            raise TypeError("Format inattendu reçu depuis osu API")',
          )
          replace(
              "collectors/osu_collector.py",
              "        except Exception:\n            return \"détail non lisible\"",
              "        except (OSError, UnicodeDecodeError):\n            return \"détail non lisible\"",
          )

          # LoL: narrow recoverable API/data failures and simplify expressions.
          replace(
              "collectors/riot/lol_collector.py",
              '                except Exception as exc:\n                    if self.debug:\n                        print(f"[LOL DEBUG] échec récupération mastery score (levels): {exc}")',
              '                except (RuntimeError, TypeError, ValueError) as exc:\n                    if self.debug:\n                        print(f"[LOL DEBUG] échec récupération mastery score (levels): {exc}")',
          )
          replace(
              "collectors/riot/lol_collector.py",
              '                except Exception as exc:\n                    if self.debug:\n                        print(f"[LOL DEBUG] échec récupération mastery points par puuid: {exc}")',
              '                except (RuntimeError, TypeError, ValueError) as exc:\n                    if self.debug:\n                        print(f"[LOL DEBUG] échec récupération mastery points par puuid: {exc}")',
          )
          replace(
              "collectors/riot/lol_collector.py",
              "                    estimated_extra_seconds = int(\n                        round(estimated_missing_games * avg_game_seconds)\n                    )",
              "                    estimated_extra_seconds = round(\n                        estimated_missing_games * avg_game_seconds\n                    )",
          )
          replace(
              "collectors/riot/lol_collector.py",
              "        except Exception as exc:\n            duration = perf_counter() - start_timer",
              "        except (RuntimeError, OSError, TypeError, ValueError, KeyError) as exc:\n            duration = perf_counter() - start_timer",
          )
          replace(
              "collectors/riot/lol_collector.py",
              '                raise RuntimeError("Format inattendu pour la liste des matchs LoL")',
              '                raise TypeError("Format inattendu pour la liste des matchs LoL")',
          )
          replace(
              "collectors/riot/lol_collector.py",
              '            except Exception as exc:\n                if self.debug:\n                    print(f"[LOL DEBUG] erreur pour {match_id}: {exc}")',
              '            except (RuntimeError, OSError, TypeError, ValueError, KeyError) as exc:\n                if self.debug:\n                    print(f"[LOL DEBUG] erreur pour {match_id}: {exc}")',
          )
          replace(
              "collectors/riot/lol_collector.py",
              '            raise RuntimeError(f"Format inattendu pour le match LoL {match_id}")',
              '            raise TypeError(f"Format inattendu pour le match LoL {match_id}")',
          )
          replace(
              "collectors/riot/lol_collector.py",
              '            raise RuntimeError("Format inattendu pour la liste de champion masteries")',
              '            raise TypeError("Format inattendu pour la liste de champion masteries")',
          )

          # Riot base: decoding an HTTP error body may fail for I/O or encoding reasons only.
          replace(
              "collectors/riot/riot_base_collector.py",
              "                except Exception:\n                    details = \"aucun détail\"",
              "                except (OSError, UnicodeDecodeError):\n                    details = \"aucun détail\"",
          )

          # Valorant: the collector boundary intentionally prevents UI crashes; optional response parsing is logged.
          replace(
              "collectors/riot/valorant_collector.py",
              "        except Exception as exc:\n            duration = perf_counter() - start_timer",
              "        except Exception as exc:  # noqa: BLE001\n            duration = perf_counter() - start_timer",
          )
          replace(
              "collectors/riot/valorant_collector.py",
              "            except Exception:\n                pass",
              '            except Exception as exc:  # noqa: BLE001\n                if self.debug:\n                    print(f"[VAL DEBUG] réponse réseau JSON ignorée: {exc}")',
          )

          # Steam: helpers normalize network failures to RuntimeError; payload type mismatch is TypeError.
          replace(
              "collectors/steam_collector.py",
              "        except Exception as exc:\n            duration = perf_counter() - start_timer",
              "        except (RuntimeError, TypeError, ValueError) as exc:\n            duration = perf_counter() - start_timer",
          )
          replace(
              "collectors/steam_collector.py",
              '            raise RuntimeError("Format inattendu reçu depuis Steam API")',
              '            raise TypeError("Format inattendu reçu depuis Steam API")',
          )

          # Windows DPI compatibility: catch only expected platform/API failures and avoid silent pass.
          replace(
              "collectors/xbox/xbox_ui_collector.py",
              "    except Exception:\n        try:\n            ctypes.windll.user32.SetProcessDPIAware()\n        except Exception:\n            pass",
              "    except (AttributeError, OSError):\n        try:\n            ctypes.windll.user32.SetProcessDPIAware()\n        except (AttributeError, OSError):\n            return",
          )

          # main.py keeps currently-disabled collectors ready for quick reactivation; underscore marks intent.
          for old, new in [
              ("    lol_collector = LoLCollector(", "    _lol_collector = LoLCollector("),
              ("    valorant_collector = ValorantCollector(", "    _valorant_collector = ValorantCollector("),
              ("    epic_collector = EpicCollector(", "    _epic_collector = EpicCollector("),
              ("    riot_account = PlatformAccount.from_riot(", "    _riot_account = PlatformAccount.from_riot("),
              ("    valorant_account = PlatformAccount(", "    _valorant_account = PlatformAccount("),
              ("    epic_account = PlatformAccount(", "    _epic_account = PlatformAccount("),
              ("        # (lol_collector, riot_account),", "        # (_lol_collector, _riot_account),"),
              ("        # (valorant_collector, valorant_account),", "        # (_valorant_collector, _valorant_account),"),
              ("        # (epic_collector, epic_account),", "        # (_epic_collector, _epic_account),"),
          ]:
              replace("main.py", old, new)

          # Xbox JSON import: malformed item data is handled explicitly.
          replace(
              "services/import_service.py",
              "            except Exception as exc:\n                print(f\"[Xbox] Jeu ignoré ({game_name}) : {exc}\")",
              "            except (KeyError, TypeError, ValueError) as exc:\n                print(f\"[Xbox] Jeu ignoré ({game_name}) : {exc}\")",
          )

          # Simplify boolean return.
          replace(
              "services/merge_service.py",
              "        if game.playtime_hours < 0:\n            return False\n\n        return True",
              "        return game.playtime_hours >= 0",
          )

          # HTTP error body decoding in the standalone Riot test.
          replace(
              "t.py",
              "    except Exception:\n        print(\"Impossible de lire le body.\")",
              "    except (OSError, UnicodeDecodeError):\n        print(\"Impossible de lire le body.\")",
          )

          # Mouse calibration DPI fallback: report failure rather than swallowing it.
          replace(
              "tools/calibrate_mouse.py",
              "except Exception:\n    try:\n        ctypes.windll.user32.SetProcessDPIAware()\n    except Exception:\n        pass",
              'except (AttributeError, OSError):\n    try:\n        ctypes.windll.user32.SetProcessDPIAware()\n    except (AttributeError, OSError):\n        print("Avertissement : gestion DPI Windows indisponible.")',
          )

          # UI boundary: displaying an unexpected error is intentional and safer than crashing the GUI.
          replace(
              "ui/app.py",
              "        except Exception as exc:\n            self.home_view.set_status(f\"Erreur inattendue : {exc}\")",
              "        except Exception as exc:  # noqa: BLE001\n            self.home_view.set_status(f\"Erreur inattendue : {exc}\")",
          )

          # Shared immutable-by-convention class configuration: make class ownership explicit to Ruff/type checkers.
          replace(
              "ui/widgets/platform_badge.py",
              "import customtkinter as ctk",
              "from typing import ClassVar\n\nimport customtkinter as ctk",
          )
          replace(
              "ui/widgets/platform_badge.py",
              "    PLATFORM_COLORS = {",
              "    PLATFORM_COLORS: ClassVar[dict[str, tuple[str, str]]] = {",
          )
          PY

      - name: Let Ruff apply any newly-safe formatting/import fixes
        run: ruff check . --fix

      - name: Verify Ruff is clean
        run: ruff check .

      - name: Commit corrected code and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/ruff-cleanup.yml
          git config user.name "OpenAI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Fix remaining Ruff diagnostics"
          git push origin HEAD:fix/ruff-cleanup
